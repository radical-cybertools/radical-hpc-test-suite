# What hpc_monitor.py needs for this machine. Job settings live in dragon_suite.sbatch.

machine = "perlmutter"
python = "/opt/cray/pe/python/3.12.12/bin/python3"  # the default python3 here is 3.6
# NERSC says to build mpi4py from source with its compiler wrapper, not to use a generic wheel.
setup = [
    "module load PrgEnv-gnu cray-mpich cudatoolkit craype-accel-nvidia80",
    "export PIP_NO_BINARY=mpi4py PIP_NO_CACHE_DIR=1 MPICC='cc -shared'",
]

[publish]
# Results go on their own branch of this repo, so machine commits stay out of the code history.
repo = "git@github.com:radical-cybertools/radical-hpc-test-suite.git"
ssh_key = "~/.hpc-monitor-grafana/deploy_key"
public_url = "https://github.com/radical-cybertools/radical-hpc-test-suite/tree/results"
branch = "results"

[[run]]
name = "rhapsody-dragon"
package = "rhapsody-py"
job_script = "dragon_suite_cpu.sbatch"  # back to dragon_suite.sbatch once GPU hours return
extra_packages = ["pytest", "pytest-asyncio", "mpi4py"]
